allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
overrides:
  # @vercel/og@0.11.x declara sharp como dependencia opcional con ^0.34.5, rango que
  # excluye las versiones corregidas (>=0.35.5: GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c,
  # GHSA-wq5f-xc86-pv6w). Solo se usa su API sharp(buf).resize().png().toBuffer(), estable
  # en 0.35; /api/og corre en edge, donde @vercel/og no importa sharp. Quitar cuando
  # @vercel/og suba de major y declare un sharp parcheado.
  '@vercel/og>sharp': ^0.35.5
